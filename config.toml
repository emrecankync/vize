# Schengen vize randevu takip ayarları
# Bu dosyayı GitHub üzerinden düzenleyip kaydetmeniz yeterli; bir sonraki
# kontrolde yeni ayarlar kullanılır.

[settings]
# Başvuruyu yaptığınız ülke (VFS kodlarıyla "tur").
source_country = ["tur", "turkiye", "türkiye", "turkey"]

# Bu durumlardan birine geçen randevular için bildirim gönderilir.
#   open          -> randevu açık
#   waitlist_open -> bekleme listesi açık
notify_statuses = ["open", "waitlist_open"]

# Kaynak bir randevuyu en son bu kadar saatten daha önce kontrol ettiyse
# "açık" bilgisine güvenme (eski/bayat veri için bildirim atma). 0 = kapalı.
max_age_hours = 12

# Randevu açık kalmaya devam ederse kaç saatte bir tekrar hatırlatılsın.
# 0 = sadece ilk açıldığında haber ver.
remind_every_hours = 6
# Hangi durumlar için hatırlatma yapılsın (bekleme listesi haftalarca açık
# kalabildiği için varsayılan olarak sadece "open").
remind_statuses = ["open"]

# Tüm kaynaklar arka arkaya bu kadar kontrolde hata verirse
# "sistem veri alamıyor" uyarısı gönderilir (10 dk aralıkla 18 = ~3 saat).
error_alert_after = 18

# HTTP isteği zaman aşımı (saniye).
timeout = 30


# ---------------------------------------------------------------------------
# Neyi takip ediyoruz?
#   codes      : "schengen" = tüm Schengen ülkeleri. Sadece bazıları için örn.
#                ["fra", "nld", "ita"] veya ["Fransa", "Hollanda"] yazabilirsiniz.
#   exclude    : istemediğiniz ülkeler, örn. ["deu"]
#   cities     : başvuru merkezi şehri (boş = tüm şehirler)
#   visa_types : boş = tüm vize türleri; örn. ["tourism", "turist"]
# ---------------------------------------------------------------------------

[[targets]]
name = "Schengen - İstanbul"
codes = ["schengen"]
exclude = []
cities = ["istanbul"]
visa_types = []


# ---------------------------------------------------------------------------
# Veri kaynakları
#
# [[api]]  : Randevu durumlarını JSON olarak yayınlayan servisler.
#            Birden fazla eklenebilir; biri çökerse diğeri kullanılır.
# [[page]] : Herhangi bir web sayfasını izler. Sayfada belirli bir yazı
#            çıkınca / kaybolunca ya da sayfa değişince haber verir.
# ---------------------------------------------------------------------------

# Ana kaynak: Visa Catcher İstanbul sayfası. İstanbul'daki VFS merkezlerinde
# ~17 ülkenin (Belçika, Bulgaristan, Çekya, Estonya, Finlandiya, Fransa,
# Hırvatistan, Hollanda, İsviçre, Letonya, Litvanya, Lüksemburg, Malta,
# Slovenya...) anlık durumunu gösterir. Başka şehir için adresi değiştirin:
#   /tr/ankara, /tr/izmir, /tr/antalya, /tr/gaziantep, /tr/trabzon
[[visacatcher]]
name = "Visa Catcher - İstanbul"
url = "https://visacatcher.bot/tr/istanbul"
city = "İstanbul"
enabled = true

# Yedek kaynak: vizetakip.app'in "son bulunan 50 randevu" listesi.
# Şu an çoğunlukla Ankara/İzmir/Gaziantep kayıtları var; İstanbul kaydı
# çıkarsa bildirilir.
[[feed]]
name = "vizetakip.app"
url = "https://vizetakip.app/"
enabled = true

# Eski kaynak: visasbot.com Haziran 2026'dan beri bakımda, kapalı.
[[api]]
name = "visasbot"
url = "https://api.visasbot.com/api/visa/list"
enabled = false

# Sayfa izleme (isteğe bağlı). Giriş gerektirmeyen bir sayfayı izler.
#
# mode = "appears"    -> patterns içindeki yazılardan biri sayfada ÇIKINCA haber ver
# mode = "disappears" -> patterns içindeki yazıların hepsi sayfadan KAYBOLUNCA haber ver
#                        (ör. "Uygun randevu bulunmamaktadır" yazısı kalkınca)
# mode = "changes"    -> sayfanın görünen metni her DEĞİŞTİĞİNDE haber ver
#
# [[page]]
# name = "Örnek sayfa"
# target = "Ülke adı"
# url = "https://..."
# mode = "disappears"
# patterns = ["uygun randevu bulunmamaktadır"]
# enabled = true
