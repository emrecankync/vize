name: Vize randevu kontrolü

on:
  schedule:
    # Her 10 dakikada bir (GitHub yoğunlukta birkaç dakika geciktirebilir).
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Sadece test bildirimi gönder"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write # zamanlanmış görevin 60 gün sonra kapanmasını önlemek için

concurrency:
  group: vize-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test bildirimi
        if: ${{ inputs.test_notify }}
        run: python checker.py --test-notify

      - name: Önceki durumu yükle
        if: ${{ !inputs.test_notify }}
        uses: actions/cache/restore@v4
        with:
          path: state
          key: vize-state-${{ github.run_id }}
          restore-keys: vize-state-

      - name: Randevuları kontrol et
        if: ${{ !inputs.test_notify }}
        run: python checker.py

      - name: Durumu kaydet
        if: ${{ always() && !inputs.test_notify }}
        uses: actions/cache/save@v4
        with:
          path: state
          key: vize-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Zamanlanmış görevi açık tut
        if: ${{ always() && github.event_name == 'schedule' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/check.yml/enable" >/dev/null
