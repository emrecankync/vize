name: Kaynak keşfi (elle)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Tarayıcıyla incelenecek adresler (boşlukla ayırın)"
        default: ""
      raw_urls:
        description: "Tarayıcısız (ham HTML) incelenecek adresler"
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python tools/probe.py $PROBE_URLS
        env:
          PROBE_URLS: ${{ inputs.urls }}
          RAW_URLS: ${{ inputs.raw_urls }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: probe/
